<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理ページ — shinEDO project</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --ai: #1F3A5F;
    --ai-deep: #12253C;
    --kinari: #F2ECD9;
    --sumi: #211D18;
    --shu: #BB4430;
    --kincha: #A9812D;
    --font-display: 'Shippori Mincho', serif;
    --font-label: 'Zen Kaku Gothic New', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--kinari);
    color:var(--sumi);
    font-family:var(--font-label);
    line-height:1.7;
  }
  .wrap{ max-width:78rem; margin:0 auto; padding:2.5rem 1.5rem 5rem; }
  h1{
    font-family:var(--font-display);
    color:var(--ai);
    font-size:1.5rem;
    margin:0 0 .3em;
  }
  .muted{ color:#5a5347; font-size:.85rem; margin:0 0 2em; }

  /* ---- login ---- */
  #loginView{ max-width:24rem; margin:4rem auto 0; }
  .field{ margin-bottom:1rem; }
  .field label{ display:block; font-size:.8rem; margin-bottom:.4em; color:var(--ai); }
  .field input{
    width:100%; padding:.7em .9em; font-size:.95rem;
    border:1px solid rgba(31,58,95,.3); border-radius:2px; background:#fff;
  }
  .password-row{ position:relative; }
  .password-row input{ padding-right:2.6em; }
  .password-toggle{
    position:absolute; right:.4em; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-size:1.05rem;
    padding:.3em; line-height:1; opacity:.6;
  }
  .password-toggle:hover{ opacity:1; }
  .btn{
    font-family:var(--font-label); font-size:.9rem; letter-spacing:.05em;
    background:var(--ai); color:var(--kinari); border:none;
    padding:.75em 1.4em; border-radius:2px; cursor:pointer;
  }
  .btn:hover{ background:var(--ai-deep); }
  .btn.danger{ background:var(--shu); }
  .btn.ghost{ background:transparent; color:var(--ai); border:1px solid rgba(31,58,95,.3); }
  .msg{ font-size:.85rem; margin-top:.8em; min-height:1.2em; }
  .msg.err{ color:var(--shu); }
  .msg.ok{ color:#3d6b3d; }

  /* ---- admin panel ---- */
  #adminView{ display:none; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }

  table{ width:100%; border-collapse:collapse; font-size:.86rem; }
  th, td{ text-align:left; padding:.7em .6em; border-bottom:1px solid rgba(31,58,95,.14); vertical-align:top; }
  th{ font-size:.72rem; letter-spacing:.05em; color:var(--ai); }
  tr.pending{ background:rgba(187,68,48,.05); }
  .status-badge{
    display:inline-block; font-size:.72rem; padding:.25em .7em; border-radius:999px;
    border:1px solid rgba(31,58,95,.3); color:var(--ai);
  }
  .status-badge.pending{ border-color:var(--shu); color:var(--shu); }
  .row-actions{ display:flex; gap:.5em; flex-wrap:wrap; }
  .row-actions button{
    font-family:var(--font-label); font-size:.78rem; padding:.4em .8em;
    border-radius:2px; cursor:pointer; border:1px solid rgba(31,58,95,.3);
    background:#fff; color:var(--ai);
  }
  .row-actions button.approve{ background:var(--ai); color:var(--kinari); border-color:var(--ai); }
  .row-actions button.reject{ background:var(--shu); color:var(--kinari); border-color:var(--shu); }
  .cell-small{ font-size:.8em; color:#5a5347; }
  .state-msg{ font-size:.85rem; color:#8a8270; padding:1rem 0; }

  .tabs{ display:flex; gap:.5em; margin-bottom:1.5rem; }
  .tabs button{
    font-family:var(--font-label); font-size:.85rem; padding:.6em 1.2em;
    border-radius:2px; cursor:pointer; border:1px solid rgba(31,58,95,.3);
    background:#fff; color:var(--ai);
  }
  .tabs button.active{ background:var(--ai); color:var(--kinari); border-color:var(--ai); }

  .event-form{
    display:grid; gap:.8em; grid-template-columns:repeat(2, 1fr);
    background:#fff; border:1px solid rgba(31,58,95,.14); padding:1.2rem; margin-bottom:2rem;
  }
  .event-form .full{ grid-column:1 / -1; }
  .event-form label{ display:block; font-size:.75rem; color:var(--ai); margin-bottom:.3em; }
  .event-form input, .event-form select, .event-form textarea{
    width:100%; padding:.6em .7em; font-size:.88rem;
    border:1px solid rgba(31,58,95,.3); border-radius:2px; background:#fff; font-family:var(--font-label);
  }
  .event-form textarea{ min-height:4rem; resize:vertical; }

  .event-row-edit input, .event-row-edit select, .event-row-edit textarea{
    width:100%; padding:.4em .5em; font-size:.82rem;
    border:1px solid rgba(31,58,95,.25); border-radius:2px; font-family:var(--font-label);
  }
  .event-row-edit textarea{ min-height:3rem; resize:vertical; }

  .events-table{ table-layout:fixed; }
  .events-table th:nth-child(1), .events-table td:nth-child(1){ width:8.5rem; }
  .events-table th:nth-child(2), .events-table td:nth-child(2){ width:5rem; }
  .events-table th:nth-child(3), .events-table td:nth-child(3){ width:24rem; }
  .events-table th:nth-child(4), .events-table td:nth-child(4){ width:24rem; }
  .events-table th:nth-child(5), .events-table td:nth-child(5){ width:6rem; }

  .members-table{ table-layout:fixed; }
  .members-table th:nth-child(1), .members-table td:nth-child(1){ width:5.5rem; }
  .members-table th:nth-child(2), .members-table td:nth-child(2){ width:14rem; }
  .members-table th:nth-child(3), .members-table td:nth-child(3){ width:5rem; }
  .members-table th:nth-child(4), .members-table td:nth-child(4){ width:22rem; }
  .members-table th:nth-child(5), .members-table td:nth-child(5){ width:9rem; }
</style>
</head>
<body>

<div class="wrap">
  <h1 style="margin-bottom:1.2rem;">shinEDO project — 管理ページ</h1>

  <div id="loginView">
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">メールアドレス</label>
        <input id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">パスワード</label>
        <div class="password-row">
          <input id="loginPassword" type="password" required autocomplete="current-password">
          <button type="button" id="togglePassword" class="password-toggle" aria-label="パスワードを表示">👁</button>
        </div>
      </div>
      <button type="submit" class="btn">ログイン</button>
      <p id="loginMsg" class="msg" role="status"></p>
    </form>
    <p class="muted" style="margin-top:1.5rem;">
      OUEN-APPのご利用は<a href="https://ouen.vercel.app/login" target="_blank" rel="noopener noreferrer">こちらのユーザーログイン</a>からどうぞ。<br>
      shinEDOのサイトは<a href="https://wasabikami.github.io/shinEDO/#top" target="_blank" rel="noopener noreferrer">こちら</a>からご覧いただけます。
    </p>
  </div>

  <div id="adminView">
    <div class="topbar">
      <span id="whoami" class="muted" style="margin:0;"></span>
      <div style="display:flex; gap:.6em;">
        <a href="https://wasabikami.github.io/shinEDO/#top" target="_blank" rel="noopener noreferrer" class="btn ghost" style="text-decoration:none; display:inline-block;">→HPへ</a>
        <a href="https://ouen.vercel.app/" target="_blank" rel="noopener noreferrer" class="btn ghost" style="text-decoration:none; display:inline-block;">→ouenアプリへ</a>
        <button id="logoutBtn" class="btn ghost">ログアウト</button>
      </div>
    </div>

    <div class="tabs">
      <button type="button" id="tabMembers" class="active">会員</button>
      <button type="button" id="tabEvents">お話会</button>
      <button type="button" id="tabAdmins">管理者</button>
    </div>

    <div id="membersPanel">
      <div class="field" style="max-width:20rem; margin-bottom:1rem;">
        <input id="memberSearch" type="text" placeholder="名前・住所・連絡先などで検索">
      </div>
      <div id="memberTableWrap">
        <p class="state-msg">読み込み中…</p>
      </div>
    </div>

    <div id="eventsPanel" style="display:none;">
      <form id="eventForm" class="event-form">
        <div>
          <label for="ev-date">開催日</label>
          <input id="ev-date" type="date" required>
        </div>
        <div>
          <label for="ev-status">状態</label>
          <select id="ev-status">
            <option value="upcoming">予定</option>
            <option value="done">終了</option>
          </select>
        </div>
        <div class="full">
          <label for="ev-guest">タイトル（ゲスト名・内容）</label>
          <input id="ev-guest" type="text" required>
        </div>
        <div class="full">
          <label for="ev-theme">補足（小さく表示・任意）</label>
          <input id="ev-theme" type="text">
        </div>
        <div class="full">
          <label for="ev-detail">詳細文章（サイト上に「詳細を見る」で表示・任意）</label>
          <textarea id="ev-detail"></textarea>
        </div>
        <div class="full">
          <label for="ev-url">関連ページURL（任意）</label>
          <input id="ev-url" type="url" placeholder="https://...">
        </div>
        <div class="full">
          <button type="submit" class="btn">お話会を追加</button>
          <p id="eventFormMsg" class="msg" role="status"></p>
        </div>
      </form>

      <div id="eventTableWrap" style="overflow-x:auto;">
        <p class="state-msg">読み込み中…</p>
      </div>
    </div>

    <div id="adminsPanel" style="display:none;">
      <form id="adminForm" class="event-form" style="grid-template-columns:1fr;">
        <div>
          <label for="admin-email">追加する人のメールアドレス</label>
          <input id="admin-email" type="email" required placeholder="先にSupabase Authでユーザー作成が必要です">
        </div>
        <div>
          <button type="submit" class="btn">管理者に追加</button>
          <p id="adminFormMsg" class="msg" role="status"></p>
        </div>
      </form>

      <div id="adminTableWrap">
        <p class="state-msg">読み込み中…</p>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lfzvxkyhbzptwnrqesbq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_caS_cQE_TjtzJRQKSul2RQ_KmNN2uR4';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView = document.getElementById('loginView');
const adminView = document.getElementById('adminView');
const loginForm = document.getElementById('loginForm');
const loginMsg = document.getElementById('loginMsg');
const whoami = document.getElementById('whoami');
const tableWrap = document.getElementById('memberTableWrap');

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
}

async function geocodeAddress(address){
  const query = address.replace(/^〒?\s*\d{3}-?\d{4}\s*/, '').trim();
  try {
    const res = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(query));
    if (!res.ok) return null;
    const results = await res.json();
    if (!Array.isArray(results) || results.length === 0) return null;
    const [lng, lat] = results[0].geometry.coordinates;
    return { lat, lng };
  } catch {
    return null;
  }
}

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) showAdmin(session);
  else showLogin();
}

function showLogin(errorText){
  loginView.style.display = 'block';
  adminView.style.display = 'none';
  if (errorText){
    loginMsg.textContent = errorText;
    loginMsg.className = 'msg err';
  }
}

async function showAdmin(session){
  const { data: adminRow } = await supabaseClient
    .from('admins')
    .select('user_id')
    .eq('user_id', session.user.id)
    .maybeSingle();

  if (!adminRow){
    await supabaseClient.auth.signOut();
    showLogin('このアカウントは管理者として登録されていません。管理者にお問い合わせください。');
    return;
  }

  loginView.style.display = 'none';
  adminView.style.display = 'block';
  whoami.textContent = session.user.email;
  await loadMembers();
}

const tabMembers = document.getElementById('tabMembers');
const tabEvents = document.getElementById('tabEvents');
const tabAdmins = document.getElementById('tabAdmins');
const membersPanel = document.getElementById('membersPanel');
const eventsPanel = document.getElementById('eventsPanel');
const adminsPanel = document.getElementById('adminsPanel');
let eventsLoaded = false;
let adminsLoaded = false;

function showTab(tab){
  tabMembers.classList.toggle('active', tab === 'members');
  tabEvents.classList.toggle('active', tab === 'events');
  tabAdmins.classList.toggle('active', tab === 'admins');
  membersPanel.style.display = tab === 'members' ? 'block' : 'none';
  eventsPanel.style.display = tab === 'events' ? 'block' : 'none';
  adminsPanel.style.display = tab === 'admins' ? 'block' : 'none';
}

tabMembers.addEventListener('click', () => showTab('members'));
tabEvents.addEventListener('click', () => {
  showTab('events');
  if (!eventsLoaded){ eventsLoaded = true; loadEvents(); }
});
tabAdmins.addEventListener('click', () => {
  showTab('admins');
  if (!adminsLoaded){ adminsLoaded = true; loadAdmins(); }
});

document.getElementById('togglePassword').addEventListener('click', () => {
  const pw = document.getElementById('loginPassword');
  const btn = document.getElementById('togglePassword');
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginMsg.textContent = 'ログイン中…';
  loginMsg.className = 'msg';
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value.trim(),
    password: document.getElementById('loginPassword').value
  });
  if (error){
    loginMsg.textContent = 'ログインできませんでした。メールアドレスとパスワードを確認してください。';
    loginMsg.className = 'msg err';
    return;
  }
  loginMsg.textContent = '';
  await showAdmin(data.session);
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  loginMsg.textContent = '';
  loginMsg.className = 'msg';
  showLogin();
});

let allMembers = [];

async function loadMembers(){
  tableWrap.innerHTML = '<p class="state-msg">読み込み中…</p>';
  const { data, error } = await supabaseClient
    .from('members')
    .select('*')
    .order('status', { ascending: true })
    .order('created_at', { ascending: false });

  if (error){
    tableWrap.innerHTML = `<p class="state-msg">読み込めませんでした（あなたは管理者として登録されていない可能性があります）。<br>${escapeHtml(error.message)}</p>`;
    return;
  }
  allMembers = data || [];
  applyMemberSearch();
}

function applyMemberSearch(){
  const q = document.getElementById('memberSearch').value.trim().toLowerCase();
  const list = !q ? allMembers : allMembers.filter(m => [
    m.name, m.category, m.contact, m.address, m.message, m.url, m.email
  ].some(v => (v ?? '').toLowerCase().includes(q)));
  renderMembersTable(list);
}

document.getElementById('memberSearch').addEventListener('input', applyMemberSearch);

function renderMembersTable(data){
  if (data.length === 0){
    tableWrap.innerHTML = '<p class="state-msg">会員データがありません。</p>';
    return;
  }

  const rows = data.map(m => `
    <tr class="${m.status === 'pending' ? 'pending' : ''}" data-id="${m.id}">
      <td>
        <span class="status-badge ${m.status === 'pending' ? 'pending' : ''}">${m.status === 'pending' ? '承認待ち' : '公開中'}</span>
      </td>
      <td class="event-row-edit">
        <input type="text" data-field="name" value="${escapeHtml(m.name)}" style="margin-bottom:.4em;">
        <select data-field="category">
          ${['個人', '里・村', 'コミュニティ', '団体・会社・企業'].map(c =>
            `<option value="${c}" ${m.category === c ? 'selected' : ''}>${c}</option>`
          ).join('')}
        </select>
      </td>
      <td>
        <select data-action="type">
          <option value="artisan" ${m.member_type === 'artisan' ? 'selected' : ''}>匠</option>
          <option value="general" ${m.member_type !== 'artisan' ? 'selected' : ''}>一般</option>
        </select>
      </td>
      <td class="event-row-edit">
        <input type="text" data-field="contact" placeholder="連絡先" value="${escapeHtml(m.contact ?? '')}" style="margin-bottom:.4em;">
        <input type="text" data-field="address" placeholder="住所" value="${escapeHtml(m.address ?? '')}" style="margin-bottom:.4em;">
        <input type="url" data-field="url" placeholder="https://..." value="${escapeHtml(m.url ?? '')}" style="margin-bottom:.4em;">
        <textarea data-field="message" placeholder="メッセージ">${escapeHtml(m.message ?? '')}</textarea>
      </td>
      <td>
        <div class="row-actions">
          ${m.status === 'pending' ? '<button class="approve" data-action="approve">承認</button>' : '<button data-action="unapprove">非公開に戻す</button>'}
          <button data-action="save-details">保存</button>
          <button class="reject" data-action="delete">削除</button>
        </div>
      </td>
    </tr>
  `).join('');

  tableWrap.innerHTML = `
    <table class="members-table">
      <thead>
        <tr><th>状態</th><th>名前・職業</th><th>匠/一般</th><th>詳細</th><th>操作</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  tableWrap.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.closest('tr').dataset.id;
      const action = btn.dataset.action;
      btn.disabled = true;
      if (action === 'approve'){
        const update = { status: 'approved' };
        const member = data.find(m => m.id === id);
        if (member && member.address && (member.lat == null || member.lng == null)){
          btn.textContent = '座標取得中…';
          const geo = await geocodeAddress(member.address);
          if (geo){ update.lat = geo.lat; update.lng = geo.lng; }
        }
        await supabaseClient.from('members').update(update).eq('id', id);
      } else if (action === 'unapprove'){
        await supabaseClient.from('members').update({ status: 'pending' }).eq('id', id);
      } else if (action === 'delete'){
        if (!confirm('このデータを削除します。よろしいですか？')) { btn.disabled = false; return; }
        await supabaseClient.from('members').delete().eq('id', id);
      } else if (action === 'save-details'){
        const tr = btn.closest('tr');
        const update = {};
        tr.querySelectorAll('[data-field]').forEach(el => {
          update[el.dataset.field] = el.value.trim() || null;
        });
        update.name = update.name || (data.find(m => m.id === id) || {}).name;

        const member = data.find(m => m.id === id);
        const addressChanged = update.address && update.address !== (member ? member.address : null);
        if (addressChanged){
          btn.textContent = '座標取得中…';
          const geo = await geocodeAddress(update.address);
          if (geo){ update.lat = geo.lat; update.lng = geo.lng; }
        }

        const { error: saveError } = await supabaseClient.from('members').update(update).eq('id', id);
        if (saveError){ alert('保存に失敗しました: ' + saveError.message); btn.disabled = false; return; }
      }
      await loadMembers();
    });
  });

  tableWrap.querySelectorAll('select[data-action="type"]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const id = sel.closest('tr').dataset.id;
      sel.disabled = true;
      await supabaseClient.from('members').update({ member_type: sel.value }).eq('id', id);
      sel.disabled = false;
    });
  });
}

/* ---------- events ---------- */
const eventTableWrap = document.getElementById('eventTableWrap');
const eventForm = document.getElementById('eventForm');
const eventFormMsg = document.getElementById('eventFormMsg');

async function loadEvents(){
  eventTableWrap.innerHTML = '<p class="state-msg">読み込み中…</p>';
  const { data, error } = await supabaseClient
    .from('events')
    .select('*')
    .order('event_date', { ascending: true });

  if (error){
    eventTableWrap.innerHTML = `<p class="state-msg">読み込めませんでした。<br>${escapeHtml(error.message)}</p>`;
    return;
  }
  if (!data || data.length === 0){
    eventTableWrap.innerHTML = '<p class="state-msg">お話会データがありません。</p>';
    return;
  }

  const rows = data.map(ev => `
    <tr class="event-row-edit" data-id="${ev.id}">
      <td><input type="date" data-field="event_date" value="${ev.event_date ?? ''}"></td>
      <td><select data-field="status">
        <option value="upcoming" ${ev.status === 'upcoming' ? 'selected' : ''}>予定</option>
        <option value="done" ${ev.status === 'done' ? 'selected' : ''}>終了</option>
      </select></td>
      <td>
        <input type="text" data-field="guest_name" value="${escapeHtml(ev.guest_name ?? '')}" style="margin-bottom:.4em;">
        <input type="text" data-field="theme" placeholder="補足（任意）" value="${escapeHtml(ev.theme ?? '')}">
      </td>
      <td>
        <textarea data-field="detail" placeholder="詳細文章（任意）">${escapeHtml(ev.detail ?? '')}</textarea>
        <input type="url" data-field="url" placeholder="https://..." value="${escapeHtml(ev.url ?? '')}" style="margin-top:.4em;">
      </td>
      <td>
        <div class="row-actions">
          <button data-action="save">保存</button>
          <button class="reject" data-action="delete">削除</button>
        </div>
      </td>
    </tr>
  `).join('');

  eventTableWrap.innerHTML = `
    <table class="events-table">
      <thead>
        <tr><th>開催日</th><th>状態</th><th>タイトル・補足</th><th>詳細・URL</th><th>操作</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  eventTableWrap.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const tr = btn.closest('tr');
      const id = tr.dataset.id;
      const action = btn.dataset.action;
      btn.disabled = true;
      if (action === 'save'){
        const update = {};
        tr.querySelectorAll('[data-field]').forEach(el => {
          update[el.dataset.field] = el.value.trim() || null;
        });
        const { error: saveError } = await supabaseClient.from('events').update(update).eq('id', id);
        if (saveError){ alert('保存に失敗しました: ' + saveError.message); btn.disabled = false; return; }
      } else if (action === 'delete'){
        if (!confirm('このお話会を削除します。よろしいですか？')) { btn.disabled = false; return; }
        await supabaseClient.from('events').delete().eq('id', id);
      }
      await loadEvents();
    });
  });
}

eventForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  eventFormMsg.textContent = '追加しています…';
  eventFormMsg.className = 'msg';

  const payload = {
    event_date: document.getElementById('ev-date').value || null,
    status: document.getElementById('ev-status').value,
    guest_name: document.getElementById('ev-guest').value.trim(),
    theme: document.getElementById('ev-theme').value.trim() || null,
    detail: document.getElementById('ev-detail').value.trim() || null,
    url: document.getElementById('ev-url').value.trim() || null
  };

  const { error } = await supabaseClient.from('events').insert(payload);
  if (error){
    eventFormMsg.textContent = '追加に失敗しました: ' + error.message;
    eventFormMsg.className = 'msg err';
    return;
  }
  eventFormMsg.textContent = '追加しました。';
  eventFormMsg.className = 'msg ok';
  eventForm.reset();
  await loadEvents();
});

/* ---------- admins ---------- */
const adminTableWrap = document.getElementById('adminTableWrap');
const adminForm = document.getElementById('adminForm');
const adminFormMsg = document.getElementById('adminFormMsg');

async function loadAdmins(){
  adminTableWrap.innerHTML = '<p class="state-msg">読み込み中…</p>';
  const { data, error } = await supabaseClient.rpc('list_admins');

  if (error){
    adminTableWrap.innerHTML = `<p class="state-msg">読み込めませんでした。<br>${escapeHtml(error.message)}</p>`;
    return;
  }
  if (!data || data.length === 0){
    adminTableWrap.innerHTML = '<p class="state-msg">管理者がいません。</p>';
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  const myEmail = session?.user?.email;

  const rows = data.map(a => `
    <tr data-email="${escapeHtml(a.email)}">
      <td>${escapeHtml(a.email)}</td>
      <td>
        <button class="reject" data-action="revoke">削除</button>
      </td>
    </tr>
  `).join('');

  adminTableWrap.innerHTML = `
    <table>
      <thead><tr><th>メールアドレス</th><th>操作</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  adminTableWrap.querySelectorAll('button[data-action="revoke"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const email = btn.closest('tr').dataset.email;
      const selfWarning = email === myEmail
        ? '自分自身の管理者権限を外そうとしています。この操作を行うと、あなたはこの管理ページを使えなくなります。\n\n'
        : '';
      if (!confirm(`${selfWarning}${email} の管理者権限を外します。よろしいですか？`)) return;
      btn.disabled = true;
      const { error } = await supabaseClient.rpc('revoke_admin', { target_email: email });
      if (error){ alert('削除に失敗しました: ' + error.message); btn.disabled = false; return; }
      await loadAdmins();
    });
  });
}

adminForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('admin-email').value.trim();
  adminFormMsg.textContent = '追加しています…';
  adminFormMsg.className = 'msg';

  const { error } = await supabaseClient.rpc('grant_admin', { target_email: email });
  if (error){
    adminFormMsg.textContent = '追加に失敗しました: ' + error.message;
    adminFormMsg.className = 'msg err';
    return;
  }
  adminFormMsg.textContent = '管理者に追加しました。';
  adminFormMsg.className = 'msg ok';
  adminForm.reset();
  await loadAdmins();
});

init();
